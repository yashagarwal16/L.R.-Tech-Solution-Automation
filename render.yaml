services:
  - type: web
    name: lr-tech-solutions
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: MANAGER_NOTIFICATION_EMAIL
        sync: false
      - key: ADDITIONAL_NOTIFICATION_EMAILS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: "whatsapp:+14155238886"
      - key: TWILIO_WHATSAPP_TO
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AUTH_OWNER_EMAIL
        sync: false
      - key: AUTH_OWNER_PASSWORD
        sync: false
      - key: AUTH_MANAGER_EMAIL
        sync: false
      - key: AUTH_MANAGER_PASSWORD
        sync: false
      - key: AUTH_EMPLOYEE_EMAIL
        sync: false
      - key: AUTH_EMPLOYEE_PASSWORD
        sync: false
      - key: AUTH_FINANCE_EMAIL
        sync: false
      - key: AUTH_FINANCE_PASSWORD
        sync: false
      - key: AUTH_HR_EMAIL
        sync: false
      - key: AUTH_HR_PASSWORD
        sync: false
      - key: AUTH_CLIENT_EMAIL
        sync: false
      - key: AUTH_CLIENT_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_CONTACT_PHONE
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP
        sync: false
      - key: NEXT_PUBLIC_EMAIL
        sync: false
      - key: NEXT_PUBLIC_PHONE
        sync: false
